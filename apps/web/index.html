<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: ピンチズーム禁止 (user-scalable=no / maximum-scale) は WCAG 1.4.4 違反のため避ける。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1a14" />
    <meta name="description" content="CPU 7 体と即プレイ、各アクションを EV / GTO 自動分析。実戦で学ぶ無料テキサスホールデム。" />
    <meta name="keywords" content="ポーカー,テキサスホールデム,GTO,EV,Win Rate,Pokergo,日本語" />
    <meta name="author" content="Pokergo" />

    <!-- Open Graph (Facebook, LINE, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pokergo" />
    <meta property="og:title" content="Pokergo — 実戦で学ぶ無料ポーカー" />
    <meta
      property="og:description"
      content="CPU 7 体と即プレイ、各アクションを EV / GTO 自動分析。最善手をハンドごとに学べる。"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pokergo — 実戦で学ぶ無料ポーカー" />
    <meta
      name="twitter:description"
      content="CPU 7 体と即プレイ、各アクションを EV / GTO 自動分析。"
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- 構造化データ (JSON-LD) — 検索エンジンが理解しやすい -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pokergo",
        "alternateName": "ポーカーゴー",
        "description": "CPU 7 体と即プレイ、各アクションを EV / GTO 自動分析。",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
        "inLanguage": "ja",
        "isAccessibleForFree": true
      }
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- Fonts:
         - Fraunces (display serif、見出し)
         - Manrope (英本文)
         - JetBrains Mono (数値・コード)
         - Shippori Mincho B1 (和文見出し用 明朝)
         - Noto Sans JP (和文本文用 ゴシック、可読性) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Pokergo — Botanical Casino</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            /* SW 登録失敗時はサイレント */
          });
        });
      }
    </script>
  </head>
  <body class="bg-ink-deepest text-ivory antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
