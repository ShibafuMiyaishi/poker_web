<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: ピンチズーム禁止 (user-scalable=no / maximum-scale) は WCAG 1.4.4 違反のため避ける。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1a14" />
    <meta name="description" content="Ten-Four の手軽さ + GTO Wizard の学習体験を統合したテキサスホールデム" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- Fonts: Fraunces (display serif), Manrope (body), JetBrains Mono (mono), Shippori Mincho (jp) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Pokergo — Botanical Casino</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            /* SW 登録失敗時はサイレント */
          });
        });
      }
    </script>
  </head>
  <body class="bg-ink-deepest text-ivory antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
