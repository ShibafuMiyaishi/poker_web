name: Deploy

# main にマージされても自動デプロイはせず、手動承認 (workflow_dispatch) のみで本番反映する。
# 仕様 §14.2「D1 マイグレーションは別 workflow で手動承認」と整合。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '対象環境 (preview / production)'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      run_migrations:
        description: 'D1 マイグレーションも適用する'
        required: false
        default: false
        type: boolean

jobs:
  deploy-api:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run D1 migrations (optional)
        if: ${{ inputs.run_migrations }}
        run: pnpm -F @pokergo/api db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: pnpm -F @pokergo/api exec wrangler deploy --env ${{ inputs.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  build-web:
    name: Build Pages bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm -F @pokergo/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
